```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhotoShare - Login</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #fafafa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .login-container {
            width: 350px;
            text-align: center;
        }

        .login-box {
            background-color: white;
            border: 1px solid #dbdbdb;
            padding: 40px 40px 25px;
        }

        .logo {
            font-family: cursive;
            font-size: 38px;
            font-weight: bold;
            margin-bottom: 30px;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            margin-bottom: 8px;
            border: 1px solid #dbdbdb;
            border-radius: 4px;
            background-color: #fafafa;
        }

        button {
            width: 100%;
            padding: 10px;
            margin-top: 12px;
            border: none;
            border-radius: 8px;
            background-color: #4f9de8;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .divider {
            margin: 25px 0;
            color: #737373;
            font-size: 13px;
        }

        .demo-link {
            color: #385185;
            font-weight: bold;
            cursor: pointer;
        }

        .forgot {
            display: block;
            margin-top: 20px;
            font-size: 12px;
            color: #00376b;
            cursor: pointer;
        }

        .signup-box {
            background-color: white;
            border: 1px solid #dbdbdb;
            padding: 22px;
            margin-top: 10px;
            font-size: 14px;
        }

        .signup {
            color: #0095f6;
            font-weight: bold;
            cursor: pointer;
        }

        .note {
            font-size: 11px;
            color: #737373;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <div class="login-container">

        <div class="login-box">

            <div class="logo">PhotoShare</div>

            <form>
                <input type="text" placeholder="Phone number, username, or email" required>

                <input type="password" placeholder="Password" required>

                <button type="submit">Log in</button>
            </form>

            <div class="divider">──────── OR ────────</div>

            <div class="demo-link">Log in with Demo Account</div>

            <span class="forgot">Forgot password?</span>

        </div>

        <div class="signup-box">
            Don't have an account?
            <span class="signup">Sign up</span>
        </div>

        <p class="note">
            Educational UI model. Not affiliated with Instagram.
        </p>

    </div>

</body>
</html>
